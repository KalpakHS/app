services:
  smartneb:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartneb:latest
    container_name: smartneb-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "80:80"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-smartneb-production-key-change-in-production
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:80,http://127.0.0.1:80
    volumes:
      # Optional persistence for SQLite database & media files across container lifecycles
      - smartneb_db_data:/app/backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  smartneb_db_data:
